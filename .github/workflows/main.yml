name: CI Pipeline

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: http://localhost:54321
      NEXT_PUBLIC_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InN4d3BpeGRjZWV2em1ucHh3cHRsIiwicm9sZSI6ImFub24iLCJpYXQiOjE2NzQ1NjUxMjMsImV4cCI6MTk5MDE0MTkyM30.qXzZzH1r8Qy_jS2zYxOq8q9n5b9vYtM4UjH3uH4yFz4

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Linter
        run: npm run lint || true

      # The build step ensures statically generated pages don't crash.
      # Anonymous fallback Supabase clients ensure this runs without secrets.
      - name: Build Next.js
        run: NEXT_PUBLIC_SUPABASE_URL=http://localhost NEXT_PUBLIC_SUPABASE_ANON_KEY=dummy npm run build
